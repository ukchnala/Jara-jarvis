name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: 9.3.1
      - name: Unzip project
        run: |
          mkdir work
          unzip -q jarvis-ai.zip -d work
          python3 patches/fix_voice.py work
          python3 patches/fix_voice_followup.py work
          python3 patches/add_agent_features.py work
          python3 patches/add_ai_backend.py work
          python3 patches/fix_ai_backend_token.py work
      - name: Make debug keystore
        working-directory: work
        run: keytool -genkeypair -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Build
        working-directory: work
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jarvis-apk
          path: work/app/build/outputs/apk/debug/*.apk
